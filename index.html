<!DOCTYPE html>
<html lang="en" class="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Route Weather — 3-Day Corridor Forecast</title>
<style>

/* ══════════════════════════════════════════════════════
   THEME VARIABLES  — applied to html so every child inherits
   ══════════════════════════════════════════════════════ */
html.light {
  --page-bg:       linear-gradient(160deg,#eef4ff 0%,#f5f8ff 50%,#e8f0fa 100%);
  --page-color:    #1a2a45;
  --header-bg:     rgba(255,255,255,0.92);
  --header-border: rgba(100,150,220,0.22);
  --title-color:   #1a3a6e;
  --sub-color:     #6080b0;
  --ctrl-bg:       rgba(210,225,255,0.5);
  --ctrl-border:   rgba(100,150,220,0.35);
  --label-color:   #5070a0;
  --track-bg:      linear-gradient(90deg,#4a80d4,#6aa8f0);
  --active-color:  #2a5ab8;
  --inactive-color:rgba(70,100,160,0.38);
  --sel-bg:        #ffffff;
  --sel-border:    rgba(100,150,220,0.4);
  --sel-color:     #1a3a6e;
  --badge-bg:      rgba(200,218,255,0.65);
  --badge-border:  rgba(100,150,220,0.25);
  --badge-color:   #3a60a8;
  --wrap-shadow:   0 4px 30px rgba(80,120,200,0.14);
  --wrap-border:   rgba(160,190,235,0.6);
  --thead-bg:      #ebf1ff;
  --thead-color:   #3a60a8;
  --thead-sub:     #7090c0;
  --thead-border:  rgba(150,185,240,0.5);
  --thead-div:     2px solid rgba(150,185,240,0.6);
  --col0:          rgba(205,224,255,0.7);
  --col1:          rgba(210,228,252,0.55);
  --col2:          rgba(215,232,250,0.38);
  --row-even:      #f6f9ff;
  --row-odd:       #eef4ff;
  --row-hover:     #ddeaff;
  --row-border:    rgba(170,200,235,0.4);
  --city-color:    #1a3a6e;
  --b0:            rgba(205,224,255,0.28);
  --b1:            rgba(210,228,252,0.2);
  --b2:            rgba(215,232,250,0.12);
  --cell-border:   rgba(160,195,235,0.35);
  --high:          #c44a18;
  --low:           #2a72c4;
  --divider:       rgba(0,0,0,0.13);
  --ph:            #1a7ec4;
  --pl:            #8098be;
  --legend:        #7090b0;
  --footer-bg:     rgba(255,255,255,0.92);
}

html.dark {
  --page-bg:       linear-gradient(135deg,#0a1628 0%,#0d2240 40%,#112b4e 70%,#0e1e35 100%);
  --page-color:    #e8f0fe;
  --header-bg:     rgba(5,15,35,0.88);
  --header-border: rgba(100,160,255,0.18);
  --title-color:   #c8deff;
  --sub-color:     #6899cc;
  --ctrl-bg:       rgba(255,255,255,0.06);
  --ctrl-border:   rgba(100,160,255,0.22);
  --label-color:   #6899cc;
  --track-bg:      linear-gradient(90deg,#3a6fc4,#5a9de8);
  --active-color:  #7fb3ff;
  --inactive-color:rgba(120,160,210,0.42);
  --sel-bg:        #0f2040;
  --sel-border:    rgba(100,160,255,0.28);
  --sel-color:     #c8deff;
  --badge-bg:      rgba(30,60,120,0.55);
  --badge-border:  rgba(100,160,255,0.18);
  --badge-color:   #8bb8ee;
  --wrap-shadow:   0 8px 40px rgba(0,0,0,0.45);
  --wrap-border:   rgba(100,160,255,0.18);
  --thead-bg:      rgba(10,22,50,0.95);
  --thead-color:   #7fb3ff;
  --thead-sub:     #4a6e9a;
  --thead-border:  rgba(100,160,255,0.14);
  --thead-div:     2px solid rgba(100,160,255,0.22);
  --col0:          rgba(50,90,160,0.18);
  --col1:          rgba(40,75,140,0.12);
  --col2:          rgba(30,60,120,0.08);
  --row-even:      rgba(12,24,52,0.65);
  --row-odd:       rgba(8,18,42,0.8);
  --row-hover:     rgba(30,60,120,0.45);
  --row-border:    rgba(100,160,255,0.08);
  --city-color:    #c0d8ff;
  --b0:            rgba(55,100,175,0.14);
  --b1:            rgba(45,85,155,0.09);
  --b2:            rgba(35,70,135,0.06);
  --cell-border:   rgba(100,160,255,0.1);
  --high:          #ff8c6a;
  --low:           #7ab0e8;
  --divider:       rgba(255,255,255,0.16);
  --ph:            #5bc4ff;
  --pl:            #4a7aaa;
  --legend:        #7090b8;
  --footer-bg:     rgba(5,15,35,0.88);
}

/* ══════════════════════════════════════════════════════
   BASE
   ══════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { min-height: 100%; }

body {
  font-family: Georgia, Cambria, serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--page-bg);
  color: var(--page-color);
  transition: background 0.4s, color 0.3s;
}

/* ══════════════════════════════════════════════════════
   HEADER
   ══════════════════════════════════════════════════════ */
header {
  position: sticky; top: 0; z-index: 10;
  padding: 12px 24px 10px;
  background: var(--header-bg);
  border-bottom: 1px solid var(--header-border);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  transition: background 0.4s, border-color 0.3s;
}
.header-inner { max-width: 1100px; margin: 0 auto; }

.title-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.title-icon { font-size: 22px; line-height: 1; }
.title-text {
  font-size: clamp(15px,3vw,21px); font-weight: 700;
  letter-spacing: 0.05em; color: var(--title-color);
  line-height: 1.15; transition: color 0.3s;
}
.subtitle-text {
  font-size: 9px; color: var(--sub-color);
  letter-spacing: 0.14em; text-transform: uppercase; transition: color 0.3s;
}

.controls-row {
  display: flex; align-items: center; gap: 16px;
  flex-wrap: nowrap; overflow-x: auto;
}

/* ══════════════════════════════════════════════════════
   PILL TOGGLE
   ══════════════════════════════════════════════════════ */
.pill {
  display: flex; align-items: center; gap: 10px; flex-shrink: 0;
  background: var(--ctrl-bg); border-radius: 40px; padding: 6px 8px;
  border: 1px solid var(--ctrl-border);
  transition: background 0.35s, border-color 0.35s;
}
.pill-label {
  font-size: 12px; font-weight: 600; letter-spacing: 0.1em;
  color: var(--inactive-color); transition: color 0.25s;
  user-select: none; padding: 2px 6px; cursor: default;
}
.pill-label.active { color: var(--active-color); }

.toggle-track {
  width: 48px; height: 26px; border-radius: 13px;
  background: var(--track-bg); cursor: pointer;
  position: relative; flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(0,0,0,0.22);
  border: 1px solid var(--ctrl-border);
  transition: background 0.35s, border-color 0.35s;
}
.toggle-knob {
  position: absolute; top: 3px; left: 3px;
  width: 18px; height: 18px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.3);
  transition: left 0.25s cubic-bezier(.4,0,.2,1);
}
.toggle-knob.right { left: 25px; }

/* ══════════════════════════════════════════════════════
   START DAY SELECT
   ══════════════════════════════════════════════════════ */
.start-day-wrap { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.start-day-label {
  font-size: 12px; font-family: Georgia, serif;
  color: var(--label-color); letter-spacing: 0.08em;
  white-space: nowrap; transition: color 0.3s;
}
#offset {
  font-family: Georgia, serif; font-size: 13px;
  background: var(--sel-bg); color: var(--sel-color);
  border: 1px solid var(--sel-border); border-radius: 8px;
  padding: 7px 12px; cursor: pointer; outline: none; min-width: 152px;
  transition: background 0.3s, border-color 0.3s, color 0.3s;
}

/* ══════════════════════════════════════════════════════
   DAY BADGES
   ══════════════════════════════════════════════════════ */
.badges { display: flex; gap: 6px; margin-left: auto; flex-shrink: 0; }
.badge {
  background: var(--badge-bg); border: 1px solid var(--badge-border);
  border-radius: 6px; padding: 4px 10px;
  font-size: 11px; font-weight: 600; color: var(--badge-color);
  letter-spacing: 0.06em; white-space: nowrap;
  transition: background 0.3s, color 0.3s, border-color 0.3s;
}

/* ══════════════════════════════════════════════════════
   MAIN & TABLE
   ══════════════════════════════════════════════════════ */
main {
  flex: 1; padding: 24px 16px 32px;
  max-width: 1100px; width: 100%; margin: 0 auto;
}
.table-wrap {
  overflow-x: auto; border-radius: 16px;
  box-shadow: var(--wrap-shadow); border: 1px solid var(--wrap-border);
  transition: box-shadow 0.3s, border-color 0.3s;
}
table { width: 100%; border-collapse: collapse; min-width: 560px; }

thead tr { background: var(--thead-bg); transition: background 0.35s; }

th.city-th {
  padding: 14px 20px; text-align: left; font-size: 11px; font-weight: 600;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--thead-sub);
  border-bottom: 1px solid var(--thead-border); width: 22%; white-space: nowrap;
  transition: color 0.3s;
}
th.day-head {
  padding: 14px 8px; text-align: center; font-size: 12px; font-weight: 700;
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--thead-color);
  border-bottom: 1px solid var(--thead-border);
  border-left: 1px solid var(--thead-border);
  transition: color 0.3s, background 0.35s;
}
th.sub-blank {
  padding: 7px 20px; border-bottom: var(--thead-div);
  background: var(--thead-bg); transition: background 0.35s;
}
th.sub-sky, th.sub-hi {
  padding: 7px 4px; text-align: center; font-size: 10px; font-weight: 600;
  letter-spacing: 0.1em; color: var(--thead-sub);
  border-bottom: var(--thead-div); transition: color 0.3s, background 0.35s;
}
th.sub-sky { border-left: 1px solid var(--thead-border); width: 10%; }
th.sub-hi  { width: 13%; }

.c0 { background: var(--col0); }
.c1 { background: var(--col1); }
.c2 { background: var(--col2); }

tbody tr { transition: background 0.15s; }
tbody tr.r-even { background: var(--row-even); }
tbody tr.r-odd  { background: var(--row-odd);  }
tbody tr:hover  { background: var(--row-hover) !important; }

td.city-td {
  padding: 16px 20px; font-size: clamp(12px,2.5vw,14px); font-weight: 600;
  color: var(--city-color); letter-spacing: 0.02em;
  border-bottom: 1px solid var(--row-border); white-space: nowrap;
  transition: color 0.3s;
}
td.sky-td {
  padding: 12px 6px; text-align: center; vertical-align: middle;
  border-bottom: 1px solid var(--row-border);
  border-left: 1px solid var(--cell-border); transition: background 0.35s;
}
td.temp-td {
  padding: 12px 8px; text-align: center; vertical-align: middle;
  border-bottom: 1px solid var(--row-border); transition: background 0.35s;
}

.b0 { background: var(--b0); }
.b1 { background: var(--b1); }
.b2 { background: var(--b2); }

.wx-icon   { font-size: clamp(20px,4vw,26px); line-height: 1; }
.wx-precip { font-size: clamp(9px,1.8vw,11px); margin-top: 4px; letter-spacing: 0.04em; color: var(--pl); transition: color 0.3s; }
.wx-precip.hi { color: var(--ph); font-weight: 700; }

.temp-stack { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.t-high { font-size: clamp(13px,2.5vw,15px); font-weight: 700; color: var(--high); transition: color 0.3s; }
.t-div  { width: 1px; height: 7px; background: var(--divider); transition: background 0.3s; }
.t-low  { font-size: clamp(11px,2vw,13px); font-weight: 500; color: var(--low); transition: color 0.3s; }

.state-td { padding: 36px; text-align: center; font-size: 14px; color: var(--legend); }
.spinner {
  display: inline-block; width: 18px; height: 18px;
  border: 2px solid var(--ctrl-border); border-top-color: var(--low);
  border-radius: 50%; animation: spin 0.75s linear infinite;
  margin-right: 8px; vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ══════════════════════════════════════════════════════
   LEGEND
   ══════════════════════════════════════════════════════ */
.legend {
  margin-top: 18px; display: flex; flex-wrap: wrap;
  gap: 16px; justify-content: center; opacity: 0.72;
}
.legend-item {
  display: flex; align-items: center; gap: 6px;
  font-size: 11px; color: var(--legend); letter-spacing: 0.06em; transition: color 0.3s;
}
.legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
#last-updated {
  margin-top: 8px; text-align: center; font-size: 10px;
  color: var(--legend); letter-spacing: 0.06em; opacity: 0.6; transition: color 0.3s;
}

/* ══════════════════════════════════════════════════════
   FOOTER
   ══════════════════════════════════════════════════════ */
footer {
  padding: 16px 24px; display: flex;
  justify-content: center; align-items: center; gap: 14px;
  background: var(--footer-bg); border-top: 1px solid var(--header-border);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  transition: background 0.4s, border-color 0.3s;
}
.footer-label {
  font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--sub-color); transition: color 0.3s;
}

</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="title-row">
      <span class="title-icon">🌤️</span>
      <div>
        <div class="title-text">ROUTE WEATHER</div>
        <div class="subtitle-text">3-Day Corridor Forecast</div>
      </div>
    </div>
    <div class="controls-row">
      <div class="pill">
        <span class="pill-label" id="lbl-east">EAST</span>
        <div class="toggle-track" id="trk-region">
          <div class="toggle-knob right" id="knb-region"></div>
        </div>
        <span class="pill-label active" id="lbl-west">WEST</span>
      </div>
      <div class="start-day-wrap">
        <span class="start-day-label">START DAY</span>
        <select id="offset"></select>
      </div>
      <div class="badges">
        <div class="badge" id="badge0"></div>
        <div class="badge" id="badge1"></div>
        <div class="badge" id="badge2"></div>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th class="city-th">City</th>
          <th class="day-head c0" colspan="2" id="h0"></th>
          <th class="day-head c1" colspan="2" id="h1"></th>
          <th class="day-head c2" colspan="2" id="h2"></th>
        </tr>
        <tr>
          <th class="sub-blank"></th>
          <th class="sub-sky c0">SKY</th><th class="sub-hi c0">LO / HI</th>
          <th class="sub-sky c1">SKY</th><th class="sub-hi c1">LO / HI</th>
          <th class="sub-sky c2">SKY</th><th class="sub-hi c2">LO / HI</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:var(--high)"></div>High temp</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--low)"></div>Low temp</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--ph)"></div>Precip &gt; 50%</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--pl)"></div>Precip &le; 50%</div>
    <div class="legend-item">· Live data via Open-Meteo</div>
  </div>
  <div id="last-updated"></div>
</main>

<footer>
  <span class="footer-label">Appearance</span>
  <div class="pill">
    <span class="pill-label active" id="lbl-light">☀️ Light</span>
    <div class="toggle-track" id="trk-theme">
      <div class="toggle-knob" id="knb-theme"></div>
    </div>
    <span class="pill-label" id="lbl-dark">🌙 Dark</span>
  </div>
</footer>

<script>
'use strict';

const CITIES = {
  west: [
    { name:'Albuquerque',   lat:35.0844, lon:-106.6504 },
    { name:'Flagstaff, AZ', lat:35.1983, lon:-111.6513 },
    { name:'Williams, AZ',  lat:35.2495, lon:-112.1909 },
    { name:'Kingman, AZ',   lat:35.1895, lon:-114.0530 },
    { name:'Barstow, CA',   lat:34.8958, lon:-117.0228 },
    { name:'Los Gatos, CA', lat:37.2358, lon:-121.9624 },
  ],
  east: [
    { name:'Albuquerque',    lat:35.0844, lon:-106.6504 },
    { name:'Tulsa, OK',      lat:36.1540, lon:-95.9928  },
    { name:'Joplin, MO',     lat:37.0842, lon:-94.5133  },
    { name:'Mentor, OH',     lat:41.6667, lon:-81.3396  },
    { name:'Belleville, OH', lat:40.6223, lon:-82.5235  },
    { name:'Erving, MA',     lat:42.5973, lon:-72.4065  },
  ],
};

function wmoIcon(c) {
  if (c === 0)  return '☀️';
  if (c <= 2)   return '⛅';
  if (c === 3)  return '☁️';
  if (c <= 49)  return '🌫️';
  if (c <= 57)  return '🌦️';
  if (c <= 65)  return '🌧️';
  if (c <= 77)  return '❄️';
  if (c <= 82)  return '🌧️';
  if (c <= 86)  return '🌨️';
  if (c <= 99)  return '⛈️';
  return '🌡️';
}

const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function dayName(n) {
  if (n === 0) return 'Today';
  const d = new Date(); d.setDate(d.getDate() + n);
  return DAYS[d.getDay()];
}

let region = 'west', offset = 0, isDark = false;
const cache = {};
const $ = id => document.getElementById(id);
const tbody = $('tbody');

const sel = $('offset');
for (let i = 0; i < 8; i++) {
  const o = document.createElement('option');
  o.value = i;
  o.textContent = i === 0 ? '0 (Today)' : `${i} (${dayName(i)})`;
  sel.appendChild(o);
}

function updateLabels() {
  for (let c = 0; c < 3; c++) {
    const lbl = dayName(offset + c);
    $(`h${c}`).textContent = lbl;
    $(`badge${c}`).textContent = lbl;
  }
}

async function fetchCity(city) {
  const key = `${city.lat},${city.lon}`;
  if (cache[key]) return cache[key];
  const url = 'https://api.open-meteo.com/v1/forecast'
    + `?latitude=${city.lat}&longitude=${city.lon}`
    + '&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max'
    + '&temperature_unit=fahrenheit&timezone=auto&forecast_days=10';
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const j = await r.json();
  cache[key] = j.daily;
  return j.daily;
}

function showLoading() {
  tbody.innerHTML = `<tr><td class="state-td" colspan="7"><span class="spinner"></span>Loading live weather…</td></tr>`;
}
function showError(msg) {
  tbody.innerHTML = `<tr><td class="state-td" colspan="7">⚠️ ${msg}</td></tr>`;
}

function renderRows(results) {
  const BC = ['b0','b1','b2'], CC = ['c0','c1','c2'];
  tbody.innerHTML = results.map(({ city, daily }, ri) => {
    let html = `<td class="city-td"><span style="margin-right:7px;opacity:0.35;font-size:10px">📍</span>${city.name}</td>`;
    for (let d = 0; d < 3; d++) {
      const di = offset + d;
      if (!daily.weathercode || di >= daily.weathercode.length) {
        html += `<td class="sky-td ${BC[d]} ${CC[d]}">—</td><td class="temp-td ${BC[d]} ${CC[d]}">—</td>`;
        continue;
      }
      const icon = wmoIcon(daily.weathercode[di]);
      const high = Math.round(daily.temperature_2m_max[di]);
      const low  = Math.round(daily.temperature_2m_min[di]);
      const precip = daily.precipitation_probability_max[di] ?? 0;
      html += `
        <td class="sky-td ${BC[d]} ${CC[d]}">
          <div class="wx-icon">${icon}</div>
          <div class="wx-precip${precip > 50 ? ' hi' : ''}">${precip}%</div>
        </td>
        <td class="temp-td ${BC[d]} ${CC[d]}">
          <div class="temp-stack">
            <span class="t-high">${high}°</span>
            <div class="t-div"></div>
            <span class="t-low">${low}°</span>
          </div>
        </td>`;
    }
    return `<tr class="${ri % 2 === 0 ? 'r-even' : 'r-odd'}">${html}</tr>`;
  }).join('');
  const t = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  $('last-updated').textContent = `Last updated: ${t} · Data: Open-Meteo.com`;
}

async function load() {
  showLoading(); updateLabels();
  try {
    const results = await Promise.all(CITIES[region].map(city => fetchCity(city).then(daily => ({ city, daily }))));
    renderRows(results);
  } catch(e) {
    console.error(e);
    showError('Could not load weather data. Check your connection and refresh.');
  }
}

function rerender() {
  updateLabels();
  const rows = CITIES[region].map(city => {
    const key = `${city.lat},${city.lon}`;
    return cache[key] ? { city, daily: cache[key] } : null;
  });
  rows.every(Boolean) ? renderRows(rows) : load();
}

$('trk-region').addEventListener('click', () => {
  region = region === 'west' ? 'east' : 'west';
  const west = region === 'west';
  $('knb-region').classList.toggle('right', west);
  $('lbl-west').classList.toggle('active', west);
  $('lbl-east').classList.toggle('active', !west);
  load();
});

sel.addEventListener('change', e => { offset = Number(e.target.value); rerender(); });

$('trk-theme').addEventListener('click', () => {
  isDark = !isDark;
  document.documentElement.classList.toggle('dark',  isDark);
  document.documentElement.classList.toggle('light', !isDark);
  $('knb-theme').classList.toggle('right', isDark);
  $('lbl-light').classList.toggle('active', !isDark);
  $('lbl-dark').classList.toggle('active',  isDark);
});

load();
</script>
</body>
</html>
